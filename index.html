<!DOCTYPE html>
<html lang="ko" data-theme>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── 로그인 오버레이 ──────────────────────────────────────────────────── -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <rect width="36" height="36" rx="8" fill="white" fill-opacity="0.15"/>
            <rect x="5"  y="8" width="7" height="20" rx="2" fill="white" fill-opacity="0.35"/>
            <rect x="14" y="8" width="7" height="20" rx="2" fill="white" fill-opacity="0.35"/>
            <rect x="23" y="8" width="7" height="20" rx="2" fill="white" fill-opacity="0.35"/>
            <rect x="6"  y="10" width="5" height="3" rx="1" fill="white"/>
            <rect x="6"  y="15" width="5" height="3" rx="1" fill="white" opacity="0.7"/>
            <rect x="15" y="10" width="5" height="3" rx="1" fill="white"/>
            <rect x="15" y="15" width="5" height="3" rx="1" fill="white" opacity="0.7"/>
            <rect x="24" y="10" width="5" height="3" rx="1" fill="white"/>
            <rect x="24" y="15" width="5" height="3" rx="1" fill="white" opacity="0.7"/>
            <rect x="24" y="20" width="5" height="3" rx="1" fill="white" opacity="0.45"/>
          </svg>
          <span class="auth-brand-name">Kanban</span>
        </div>
        <p class="auth-header-sub">작업을 체계적으로 관리하세요</p>
      </div>

      <div id="authFormView" class="auth-body">
        <h2 id="authTitle" class="auth-form-title">로그인</h2>
        <form id="authForm" class="auth-form" novalidate>
          <div class="auth-field">
            <label for="authEmail">이메일</label>
            <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="auth-field">
            <label for="authPassword">비밀번호</label>
            <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <p id="authError" class="auth-error"></p>
          <button class="auth-submit" type="submit" id="authSubmitBtn">로그인</button>
        </form>
        <div class="auth-toggle">
          <span id="authToggleText">계정이 없으신가요?</span>
          <button type="button" id="authToggleBtn">회원가입</button>
        </div>
      </div>

      <div id="authVerifyView" class="auth-body auth-verify" style="display:none">
        <div class="verify-icon-wrap">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <circle cx="32" cy="32" r="32" fill="#3F51B5" fill-opacity="0.08"/>
            <rect x="10" y="20" width="44" height="30" rx="4" stroke="#3F51B5" stroke-width="2" fill="none"/>
            <path d="M10 25l22 16 22-16" stroke="#3F51B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="48" cy="44" r="9" fill="#4CAF50"/>
            <path d="M44 44l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="auth-form-title">이메일을 확인해주세요</h2>
        <p class="verify-desc">
          <strong id="verifyEmail"></strong>으로<br>
          인증 링크를 보냈습니다.<br>
          링크를 클릭하면 자동으로 로그인됩니다.
        </p>
        <button type="button" id="backToLoginBtn" class="auth-back-btn">← 로그인으로 돌아가기</button>
      </div>
    </div>
  </div>

  <!-- ── 공유 모달 ────────────────────────────────────────────────────────── -->
  <div id="shareModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3>보드 공유</h3>
        <button id="closeShareBtn" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <form id="inviteForm" class="invite-form">
          <input id="inviteEmail" type="email" placeholder="초대할 이메일 주소" required>
          <button type="submit">초대</button>
        </form>
        <p id="inviteMsg" class="invite-msg"></p>
        <p class="section-label">현재 멤버</p>
        <ul id="memberList" class="member-list"></ul>
      </div>
    </div>
  </div>

  <!-- ── 카드 편집 모달 ────────────────────────────────────────────────────── -->
  <div id="cardModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3>카드 편집</h3>
        <button id="closeCardModalBtn" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label for="cardModalText">내용</label>
          <textarea id="cardModalText" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="cardModalDeadline">마감일</label>
            <input type="date" id="cardModalDeadline">
          </div>
          <div class="form-field">
            <label for="cardModalPriority">우선순위</label>
            <select id="cardModalPriority">
              <option value="">없음</option>
              <option value="low">낮음</option>
              <option value="medium">보통</option>
              <option value="high">높음</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label for="cardModalTags">태그
            <span class="label-hint">쉼표로 구분</span>
          </label>
          <input type="text" id="cardModalTags" placeholder="예: 디자인, 프론트엔드">
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveCardBtn" class="btn-confirm">저장</button>
        <button id="cancelCardBtn" class="btn-cancel">취소</button>
      </div>
    </div>
  </div>

  <!-- ── Navbar ────────────────────────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="nav-left">
      <span class="nav-logo">Kanban</span>
      <div class="board-nav">
        <span id="boardName" class="board-name"></span>
        <select id="boardSelect" class="board-select" style="display:none"></select>
      </div>
    </div>
    <div class="nav-right">
      <button id="shareBtn" class="nav-btn" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        공유
      </button>
      <button id="activityBtn" class="nav-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        활동
      </button>
      <div class="user-chip">
        <svg class="icon-user" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="userLabel">Guest</span>
      </div>
      <button id="logoutBtn" class="logout-btn">로그아웃</button>
      <button id="themeToggle" aria-label="테마 전환">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ── App Layout ────────────────────────────────────────────────────────── -->
  <div class="app-layout">
    <main class="board">
      <div class="column" data-col="todo">
        <div class="col-header">
          <h2>To Do</h2>
          <span class="col-count">0</span>
        </div>
        <div class="card-list" id="list-todo"></div>
        <button class="add-btn" data-col="todo">+ Add card</button>
      </div>
      <div class="column" data-col="in-progress">
        <div class="col-header">
          <h2>In Progress</h2>
          <span class="col-count">0</span>
        </div>
        <div class="card-list" id="list-in-progress"></div>
        <button class="add-btn" data-col="in-progress">+ Add card</button>
      </div>
      <div class="column" data-col="done">
        <div class="col-header">
          <h2>Done</h2>
          <span class="col-count">0</span>
        </div>
        <div class="card-list" id="list-done"></div>
        <button class="add-btn" data-col="done">+ Add card</button>
      </div>
    </main>

    <aside id="activityPanel" class="activity-panel" hidden>
      <div class="activity-header">
        <h3>활동 로그</h3>
        <button id="closeActivityBtn" class="modal-close">✕</button>
      </div>
      <ul id="activityList" class="activity-list"></ul>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
